reference_analysis:
  figure_family: genome
  semantic_purpose: Public packaged currentplotCSV/nativecurrentlayout replay only.
    No authorraw processing, completepaperfigurefidelity, historicalgate inheritance,
    newinputtransfer or stabletemplate claim.
  panels:
  - id: author-public-chr7
    role: BUSCO ortholog coordinate map + synthase overlays
    position: single standalone main panel
  elements:
  - id: busco
    role: Ortholog coordinates and homologous connections
    geometry: Native BUSCOplot points and polylines
    position: main data region
    data_mapping: BUSCO row key, ordered sample columns, position bp
    required: true
  - id: synthase
    role: Sequence-match locations
    geometry: Outlined filled triangle markers and comparative CBDAS path
    position: author sstart in same coordinate system
    data_mapping: query accession/percent identity/gaps and sample key
    required: true
  - id: labels
    role: Coordinate and sample-group identity
    geometry: Typography and axis ticks
    position: left axis/top or bottom labels
    data_mapping: author sample order and named classes
    required: true
  - id: key
    role: Explicit marker meaning
    geometry: Triangle key and text
    position: reserved top band
    data_mapping: synthase category/author vs public sample identifiers
    required: true
  relationships:
  - from: busco
    to: synthase
    type: shares-coordinate
    shared_key: sample and bp
  spatial_topology:
    coordinate_system: ordered sample x;author bp y
    reading_order:
    - ordered samples
    - named overlay/key
    alignment_keys:
    - BUSCO id
    - sample
    - bp
    layer_order:
    - BUSCO connections and points
    - CBDAS path
    - high-stringency triangles
    - axes/key/labels
  required_structures:
  - all source-selected coordinates
  - native line grouping and NA behavior
  - outlined coloured triangles
  - original ordering and public-reference crossings
  forbidden_substitutions:
  - simulated data
  - drop source-selected coordinates
  - flip or reanchor unrequested coordinates
  - wholeoriginal figure claim
