reference_analysis:
  figure_family: matrix
  semantic_purpose: OncoPrint describing synthetic gene-event presence and aligned
    sample annotations.
  panels:
  - id: main
    role: native matrix with keyed top/right annotations
    position: central above reserved legends
  elements:
  - id: matrix
    role: event landscape
    geometry: 12x144 native event matrix,124x66mm
    position: central
    data_mapping: gene/sample/event_type
    required: true
  - id: annotations
    role: synthetic sample metadata and burden
    geometry: native top barplot and two category strips
    position: above matrix
    data_mapping: sample_id
    required: true
  - id: frequency
    role: distinct-tumour frequency
    geometry: native percentages and right horizontal bars
    position: right of matrix
    data_mapping: gene distinct-sample numerator/144
    required: true
  - id: labels
    role: row/column group names
    geometry: Arial keyed labels
    position: left gene names/top three cohort names
    data_mapping: gene/sample cohort
    required: true
  - id: legend
    role: event/metadata decoding
    geometry: packed native categorical legends
    position: separate bottom band
    data_mapping: exact semantic colors
    required: true
  - id: note
    role: simulation declaration
    geometry: single7.5pt footer
    position: bottom outside legends
    data_mapping: synthetic input provenance
    required: true
  relationships:
  - from: matrix
    to: annotations
    type: shares-order
    shared_key: sample_id
  - from: matrix
    to: frequency
    type: shares-order
    shared_key: gene
  - from: matrix
    to: labels
    type: shares-order
    shared_key: gene/sample_id
  - from: matrix
    to: legend
    type: reading-order
    shared_key: event_type/category
  - from: legend
    to: note
    type: reading-order
    shared_key: simulation provenance
  spatial_topology:
    coordinate_system: Cartesian native heatmap grid
    reading_order:
    - top annotations
    - event matrix
    - right frequency
    - bottom legends
    - simulation declaration
    alignment_keys:
    - gene
    - sample_id
    layer_order:
    - neutral background
    - nonoverlapping event-class stripes
    - annotations
    - legends
  required_structures:
  - Native multi-event oncoPrint cells preserve all classes.
  - All144 columns, sample burden and metadata share sample keys/order.
  - Right distinct-tumour frequencies use the fixed144 assayed denominator.
  - Legends occupy a reserved bottom band.
  forbidden_substitutions:
  - No ordinary geom_tile replacement for native oncoPrint.
  - No event pruning,empty-column filtering or independent annotation sorting.
visual_hierarchy:
  primary: Color event cells and aligned synthetic metadata.
  secondary: Gene labels,frequency axis and separate bottom legends.
encoding:
  color: Five event-class colors; separate metadata semantic mappings.
  cell: Each coexisting type retains a nonoverlapping colored stripe.
  bar: Top altered-gene count;right distinct-tumour frequency percent.
  blank: No simulated event detected;every assay measured.
annotation:
  metadata: Synthetic Sex/Smoking with explicit Unknown.
  cohort: Three named48-tumour column groups.
  simulation: Visible provenance footer.
legend:
