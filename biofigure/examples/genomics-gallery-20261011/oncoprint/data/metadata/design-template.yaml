  input: 144 synthetic tumours x12 genes;424 events in368 altered cells,56 multi-event
    cells;all1728 assays present
  unit: synthetic tumour and gene
  origin: self-generated seed2026101108
  exclusions: none;13 zero-event tumours retained
  statistics: descriptive frequency only; no inferential test
