schema_version: '1.0'
kind: biofigure-checkpoint-protocol
status_enum:
- PASS
- REVISE
- STOP
- NOT_RUN
sequence_rule: a checkpoint may PASS only when every earlier checkpoint PASSed
checkpoints:
- id: CP0
  phase: scientific-intent
  gate_type: conditional_user_stop
  required_evidence:
  - scientific_question
  - figure_task
  - claim_boundary
  - unresolved_critical_fields
  stop_conditions:
  - unresolved_critical_scientific_semantics
  - conflicting_user_requirements
  - irreversible_interpretive_choice
  do_not_stop_for:
  - cosmetic_preference_only
  - reversible_layout_choice
  - renderer_default
  fail_action: ask_one_concise_question_then_STOP
- id: CP1
  phase: scientific-contract
  gate_type: automatic_hard_gate
  required_evidence:
  - sample_mapping_checked
  - replicate_unit
  - scale_and_transform
  - statistics_contract
  - coordinate_contract
  fail_action: repair_contract_or_STOP_before_design
- id: CP2
  phase: design-lock
  gate_type: automatic_hard_gate
  required_evidence:
  - selected_pattern
  - design_spec
  - design_spec_validation
  - renderer_available
  - layout_slots_reserved
  - preparation_receipt
  source_modes_required_evidence: [reference_method_receipt]
  original_mode: design_analysis_and_full_six_dimension_review_required
  fail_action: revise_spec_before_code
- id: CP3
  phase: rendered-figure-inspection
  gate_type: automatic_hard_gate
  required_evidence:
  - first_render
  - first_render_sha256
  - artifact
  - artifact_sha256
  - render_receipt
  - target_size
  - artifact_opened
  - viewer_method
  - target_size_checked
  - detected
  fail_action: object_level_fix_and_rerender
- id: CP4
  phase: release
  gate_type: automatic_hard_gate
  required_evidence:
  - critic_status
  - qa_status
  - inspection_evidence
  - reviewer_type
  - reviewer_id
  - deliverables
  - simulation_disclosed
  fail_action: withhold_PASS_and_return_diagnosis
visual_color_policy:
  first_render: semantic-color
  monochrome_data_marks: REVISE
  CP4_check: semantic_color
  colored_data_marks_required_for_PASS: true
  decorative_color_only: REVISE
canvas_text_policy:
  footer_policy_id: no-canvas-footer-v1
  caption_footer_footnote_methods_prose: forbidden
  heading_or_allowlist_exemption: false
  CP3_rendered_text_required: all_renderers
  CP4_check: footer_absent
  footer_detected: REVISE
  missing_actual_footer_observation: withhold_PASS
