pattern_id: SC-QC-001
version: "1.1"
domain: [single-cell]
scientific_task: [cell-quality-control]
message_type: quality-distribution
data_contract: {required: [cell_id, n_counts, n_genes], optional: [mt_fraction, sample_id, threshold, qc_status], assumptions: [threshold_provenance]}
applicable_when: {data_profile: {n_features: 1-4, n_observations: 50-200000}, message: prefilter-quality-and-threshold}
not_recommended_when: [condition_comparison_without_sample_replicates, mixed_units_same_axis, postfilter_only_threshold_claim]
visual_hierarchy: {primary: complementary_metric_views, secondary: threshold_and_quality_gradient, tertiary: sample_level_summary}
geometry: {primary: [histogram, barcode_rank_log_curve, counts_genes_scatter], secondary: [low_count_inset, threshold_lines]}
encoding: {distribution_x: qc_metric, distribution_y: frequency, rank_x: descending_barcode_rank, rank_y: log_count_depth, scatter_x: count_depth, scatter_y: detected_genes, scatter_color: mitochondrial_fraction, line: threshold}
layout: {aspect_ratio: data_driven, density_strategy: alpha_and_order_control, whitespace_strategy: labels_first}
annotation_strategy: [threshold_line, retained_removed_legend, n_cells_and_filter_rule_in_manifest]
legend_strategy: {compact: true, place: outside_right_for_continuous_scatter_only, duplicate_semantics: false, no_overlap: true}
color_semantics: {retained: navy, removed: brick_red, metric_fill: muted_neutral, threshold: brick_red}
optional_components: [sample-level-summary, postfilter-companion-panel]
avoid: [filtering_before_threshold_plot, pooled_cells_as_replicates, unexplained_threshold, decorative_title, rainbow_palette, inset_counted_as_panel_tag, colourbar_over_data]
scientific_risks: [threshold_arbitrariness, double_filtering, cell_as_biological_replicate, outlier_clipping]
renderer_options: [ggplot2, Seurat_plus_custom_ggplot, scanpy]
references: [source-index://scanpy, source-index://seurat-visualization]
provenance: {created_from: [source-index://scanpy, source-index://seurat-visualization, doi://10.15252/msb.20188746/figure-2], reviewed_by: BioFigure-maintainer, reviewed_at: 2026-09-26}
confidence: medium
validation: {scientific: source-reviewed, visual: final-size-reviewed, benchmark: source-exposed-structural-reproduction}
status: candidate
