schema_version: "1.0"
selection_rule: match data semantics first; palette name never overrides scientific meaning
runtime_policy: read_only; user colors override library; run actual-figure CVD diagnostics before publication
sources:
  ggsci: {url: "https://nanx.me/ggsci/articles/ggsci.html", scope: "journal-inspired, not official journal standards", version: "5.2.0"}
  colorbrewer: {url: "https://colorbrewer2.org/learnmore/schemes.html", scope: "qualitative, sequential and diverging semantics"}
  okabe_ito: {url: "https://jfly.uni-koeln.de/color/", scope: "color universal design qualitative palette"}
  paul_tol: {url: "https://sronpersonalpages.nl/~pault/", scope: "colour-blind-safe qualitative schemes"}
  scientific_colour_maps: {url: "https://www.fabiocrameri.ch/colourmaps/", scope: "perceptually uniform scientific maps", version: "8.0.1"}
  viridis: {url: "https://sjmgarnier.github.io/viridis/", scope: "perceptually uniform sequential maps"}

palettes:
  - id: okabe-ito-8
    label: Okabe-Ito
    kind: categorical
    max_categories: 8
    cvd_status: source_claimed_safe
    source: okabe_ito
    colors: ["#E69F00", "#56B4E9", "#009E73", "#F0E442", "#0072B2", "#D55E00", "#CC79A7", "#000000"]
    recommended_for: [lines, points, compact categorical comparisons]
