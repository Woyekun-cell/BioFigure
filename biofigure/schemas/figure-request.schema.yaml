schema_version: "1.1"
required: [figure_task, data_shape, primary_domain, primary_role, backend, deliverable]
optional: [statistics_required,figure_family, operation, use_personal_style, pattern_id, primary_source, learned_method_id, reusable_case_id, secondary_domains, secondary_roles, reference_sources, declared_tools, declared_permissions, required_tools, available_tools, required_permissions, available_permissions]
backend: [R, Python]
deliverable: [quick-png, paper-composite, editable-vector, tiff-submission]
reference_sources: [reproduction, top_journal, scidraw, awesome_scientific_figure]
reference_sources_required: [reproduction, top_journal, scidraw]
reference_sources_default: [reproduction, top_journal, scidraw]
rule: exactly_one_backend_and_one_primary_domain_and_role
figure_family: [distribution, matrix, composition, network, tree, genome, single-cell, enrichment, clinical, time-series, circular, map, schematic-mechanism, multipanel, other]
field_types:
  figure_task: non-empty-string
  figure_family: non-empty-string
  data_shape: non-empty-string
  primary_domain: non-empty-string
  primary_role: non-empty-string
  backend: enum
  deliverable: enum
operation: [select, draw, reproduce, review, revise]
normalization:
  exclude_from_request_id: [model_label, model_name, working_directory, cwd, timestamp]
  sort_mapping_keys: true
  sort_set_like_arrays: [secondary_domains, secondary_roles, reference_sources]
